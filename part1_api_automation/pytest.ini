minversion = 8.0
python_version = 3.13

# 테스트 탐색 경로
testpaths =
    tests

# 테스트 파일/클래스/함수 규칙
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# PYTHONPATH 설정
pythonpath =
    .

# 기본 실행 옵션\
addopts =
    -ra
    --strict-markers
    --disable-warnings
    --tb=short

markers =
    auth: 인증/권한 관련 테스트
    course: 강의/과목 API 테스트
    exam: 시험 시나리오 테스트
    positive: 정상 시나리오
    negative: 예외/오류 시나리오
    smoke: 핵심 기능 스모크 테스트
    slow: 실행 시간이 긴 테스트

# Warning 필터 (Python 3.13 대응)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning