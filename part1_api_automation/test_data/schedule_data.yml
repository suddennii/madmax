# [2] 상세 정보 조회 (test_get_detail_info)
# url_path의 {ORG_NAME}은 파이썬 코드에서 불러올 때 치환됩니다.
detail_info:
  - tc_id: "SCH-10,11"
    desc: "3팀 회의실 상세 조회"
    url_type: "rest"
    path: "/org/{ORG_NAME}/course/lectureroom/get/"
    params:
      lectureroom_id: 135111
    response_key: "lectureroom"
    exp_title: "3팀 회의실"
  - tc_id: "SCH-12"
    desc: "프로젝트 오리엔테이션 상세 모달 열림"
    url_type: "course"
    path: "/lecture_page"
    params:
      filter_lecture_id: 6657778
      filter_locator_type: 0
      filter_is_opened: "true"
      skip: 0
      count: 10
      elice_course_id: 768550
    response_key: null
    exp_title: "02.02(월) 프로젝트 오리엔테이션"
  - tc_id: "SCH-13"
    desc: "QR 체크인/체크아웃 상세 조회"
    url_type: "rest"
    path: "/org/{ORG_NAME}/course/get/"
    params:
      course_id: 759075
    response_key: "course"
    exp_title: "QR 체크인/체크아웃"

